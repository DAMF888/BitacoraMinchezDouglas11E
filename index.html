<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bitácora Mínchez Douglas</title>
    <link rel="icon" type="image/png" href="recursos/img/LC1.png" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1>Bitácora Segunda y Tercera Unidad</h1>
    </header>

    <main>
      <h3 class="seccion-titulo">Registro de Actividades</h3>

      <div class="carousel-container">
        <button class="carousel-btn prev-btn" id="prevBtn" aria-label="Anterior">&#10094;</button>
        
        <div class="carousel-track-container">
          <div class="carousel-track" id="carouselTrack">
            
            <div class="carousel-item" onclick="openModal('pdf', 'Documentos y capturas/arduinoDM.pdf', 'Introducción a Arduino')">
              <div class="item-card">
                <h2>Introducción a Arduino</h2>
                <span class="view-more">Ver documento</span>
              </div>
            </div>

            <div class="carousel-item" onclick="openModal('video', 'recursos/Página Web  DM.mp4', 'Diseño de Página Web')">
              <div class="item-card">
                <h2>Diseño de Página Web</h2>
                <span class="view-more">Ver video</span>
              </div>
            </div>

            <div class="carousel-item" onclick="openModal('video', 'recursos/Primer Circuito  DM.mp4', 'Primer Circuito')">
              <div class="item-card">
                <h2>Primer Circuito</h2>
                <span class="view-more">Ver video</span>
              </div>
            </div>

            <div class="carousel-item" onclick="openModal('video', 'recursos/CircuitoLedRGB.mp4', 'Circuito LED RGB')">
              <div class="item-card">
                <h2>Circuito LED RGB</h2>
                <span class="view-more">Ver video</span>
              </div>
            </div>

            <div class="carousel-item" onclick="openModal('video', 'recursos/CircuitoFisico1.mp4', 'Circuito Físico 1')">
              <div class="item-card">
                <h2>Circuito Físico 1</h2>
                <span class="view-more">Ver video</span>
              </div>
            </div>

          </div>
        </div>

        <button class="carousel-btn next-btn" id="nextBtn" aria-label="Siguiente">&#10095;</button>
      </div>
    </main>

    <div id="projectModal" class="modal">
      <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle" class="modal-title">Título del Proyecto</h2>
        <div id="modalBody" class="modal-body">
          </div>
      </div>
    </div>

    <footer>
      <span>2026 Douglas Mínchez</span>
      <img
        src="https://www.capouilliez.edu.gt/assets/img/logo.png"
        alt="Logo Colegio"
        width="115px"
        height="30px"
      />
    </footer>

    <script>
      // Funcionalidad de desplazamiento del Carrusel
      const track = document.getElementById('carouselTrack');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');

      if (track && prevBtn && nextBtn) {
        prevBtn.addEventListener('click', () => {
          track.scrollBy({ left: -320, behavior: 'smooth' });
        });
        nextBtn.addEventListener('click', () => {
          track.scrollBy({ left: 320, behavior: 'smooth' });
        });
      }

      // Funcionalidad de apertura de la Ventana Modal Interna
      function openModal(type, src, title) {
        const modal = document.getElementById('projectModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        
        modalTitle.textContent = title;
        modalBody.innerHTML = ''; // Limpiar contenedor anterior

        if (type === 'pdf') {
          modalBody.innerHTML = `<embed src="${src}" type="application/pdf" width="100%" height="650px" />`;
        } else if (type === 'video') {
          modalBody.innerHTML = `
            <video controls width="100%" autoplay>
              <source src="${src}" type="video/mp4">
              Navegador no compatible con video HTML5.
            </video>`;
        }

        modal.classList.add('active');
        document.body.style.overflow = 'hidden'; // Deshabilita scroll de fondo
      }

      // Funcionalidad de cierre de la Ventana Modal
      function closeModal() {
        const modal = document.getElementById('projectModal');
        const modalBody = document.getElementById('modalBody');
        modalBody.innerHTML = ''; // Vacía el contenido para detener la reproducción de videos
        modal.classList.remove('active');
        document.body.style.overflow = ''; // Restaura scroll de fondo
      }

      // Cerrar si el usuario hace click fuera de la caja de contenido central
      window.onclick = function(event) {
        const modal = document.getElementById('projectModal');
        if (event.target === modal) {
          closeModal();
        }
      }
    </script>
  </body>
</html>
