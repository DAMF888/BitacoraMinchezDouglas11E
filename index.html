<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Natura | Bitácora Cinemática</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Playfair+Display:ital,wght@0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="header__title">Bitácora TICS</h1>
      <p class="header__bio">
        Una exploración visual a las actividades de tecnología realizadas durante el año.
      </p>
    </header>

    <main class="film-section">
      <div class="film-container">
        <div id="film-strip" class="film-strip"></div>
        <button class="film-control prev" id="prevBtn" aria-label="Anterior">
          &#10094;
        </button>
        <button class="film-control next" id="nextBtn" aria-label="Siguiente">
          &#10095;
        </button>
      </div>
    </main>

    <footer class="footer">
      <div class="footer__content">
        <span>© 2026 Douglas Mínchez — Actividades Evaluadas</span>
        <img
          src="https://www.capouilliez.edu.gt/assets/img/logo.png"
          alt="Logo Colegio"
          class="footer__logo"
        />
      </div>
    </footer>

    <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar modo">
      <span id="theme-icon">☾</span>
    </button>

    <div id="lightbox" class="modal">
      <span class="modal__close">&times;</span>
      <div class="modal__content">
        <div id="modal-media-wrapper" class="modal__media-container">
          </div>
        <div class="modal__caption">
          <h3 id="modal-title"></h3>
          <p id="modal-date" class="modal__date"></p>
          <p>
            Evidencia digital y registro técnico optimizado.
          </p>
        </div>
      </div>
    </div>
    
    <script src="script.js" defer></script>
  </body>
</html>
